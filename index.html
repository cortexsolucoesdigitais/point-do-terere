<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio Digital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:light;--bg:#f6faf0;--card:#fff;--ink:#13240b;--mute:#5f6f55;--line:#dce8cc;--acc:#2f7a17;--accbg:#e4f1cf;--gold:#8dc63f;--hero1:#224305;--hero2:#3f7a1c;--herobase:#224305;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1709;--card:#16230f;--ink:#eef6e4;--mute:#9db08c;--line:#2a3d1e;--acc:#8dc63f;--accbg:#25381a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1709;--card:#16230f;--ink:#eef6e4;--mute:#9db08c;--line:#2a3d1e;--acc:#8dc63f;--accbg:#25381a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 128px);height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero1);z-index:30}
.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800}
.hero{position:relative;overflow:hidden;background:var(--herobase);color:#fff}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;background:var(--bg);border-radius:26px 26px 0 0}
.logo{display:block}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);transition:all .15s}
.chip.on{background:var(--gold);border-color:var(--gold);color:#13240b;box-shadow:0 4px 14px rgba(141,198,63,.35)}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(19,36,11,.05);animation:up .35s both;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.ico{width:2.6rem;height:2.6rem;border-radius:.95rem;display:grid;place-items:center;font-size:1.35rem;background:linear-gradient(135deg,var(--hero1),var(--hero2))}
.note{background:var(--accbg);color:var(--ink)}
.pill{background:var(--gold);color:#13240b;font-weight:800;border-radius:999px;padding:.3rem .85rem;white-space:nowrap;font-size:1.05rem}
.pill small{font-weight:700;font-size:.68em;margin-right:2px}
.tile{background:var(--accbg);border-radius:.9rem;padding:.5rem .3rem;text-align:center}
.tile .l{font-size:.7rem;color:var(--mute)}
.tile .v{font-weight:800;color:var(--acc);font-size:.95rem}
.mute{color:var(--mute)}
.add{border:1.5px solid var(--acc);color:var(--acc);background:transparent;border-radius:999px;font-weight:700;font-size:.82rem;padding:.3rem .85rem;white-space:nowrap}
.add:active{background:var(--accbg)}
.step{display:inline-flex;align-items:center;gap:.4rem;background:var(--gold);color:#13240b;border-radius:999px;padding:.12rem .25rem;font-weight:800}
.step button{width:1.6rem;height:1.6rem;border-radius:999px;font-size:1.1rem;font-weight:800;line-height:1}
.step span{min-width:1rem;text-align:center}
.pay{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;border:1px solid var(--line);background:var(--card);border-radius:1rem;margin-bottom:.5rem;font-weight:600}
.pay input{-webkit-appearance:none;appearance:none;width:1.3rem;height:1.3rem;border:2px solid var(--ink);border-radius:50%;margin:0;flex:none}
.pay input:checked{background:radial-gradient(circle,var(--ink) 0 38%,transparent 42%)}
.fld{display:block;width:100%;border-radius:1rem;padding:.75rem 1rem;font-size:1rem;outline:none;background:var(--card);border:1px solid var(--line);color:var(--ink);margin-bottom:.5rem}
</style>
</head>

    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-base pointer-events-none">🔍</span>
    <input id="q" type="search" placeholder="Buscar prato pelo nome…" autocomplete="off"
      class="w-full rounded-2xl pl-11 pr-4 py-3 text-base outline-none focus:ring-2" style="background:var(--card);border:1px solid var(--line);color:var(--ink);--tw-ring-color:var(--gold)">
  </div>
  <div id="chips" class="chips flex gap-2 overflow-x-auto mt-3 -mx-4 px-4"></div>
</div>

<main id="menu" class="px-4 pt-5 pb-6 max-w-xl mx-auto"></main>
<footer class="px-4 pb-44 text-center text-xs mute">Produzido por Córtex Soluções Digitais</footer>

<div class="fixed left-0 right-0 bottom-0 z-20 px-4 pt-6" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) 60%,transparent)">
  <div class="max-w-xl mx-auto">
    <button id="cartBtn" style="display:none;background:var(--hero1);color:#fff;border:1px solid var(--gold)" class="w-full mb-2 rounded-2xl px-4 py-3 items-center justify-between font-semibold"><span>🛒 Meu pedido · <span id="cn"></span></span><span id="ct" style="color:var(--gold)"></span></button>
    <a id="cta" target="_blank" rel="noopener" class="block text-center rounded-2xl py-4 text-lg font-bold" style="background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;box-shadow:0 10px 28px rgba(18,140,74,.4)">📱 Fazer Pedido no WhatsApp</a>
  </div>
</div>

<div id="sheet" style="display:none" class="fixed inset-0 z-40">
  <div id="sBack" class="absolute inset-0" style="background:rgba(0,0,0,.55)"></div>
  <div class="absolute left-0 right-0 bottom-0 max-w-xl mx-auto rounded-t-3xl px-5 pt-5 overflow-y-auto" style="background:var(--bg);max-height:85%;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)">
    <div class="flex items-center justify-between"><h2 class="disp text-3xl">🛒 Meu pedido</h2><button id="sClose" class="text-2xl px-2" aria-label="Fechar">✕</button></div>
    <div id="cartList"></div>
    <div class="mt-4">
      <div class="font-semibold mb-2">Seus dados</div>
      <input id="fNome" type="text" autocomplete="name" placeholder="Seu nome *" class="fld">
      <input id="fTel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Telefone / WhatsApp com DDD *" class="fld">
      <input id="fEnd" type="text" autocomplete="street-address" placeholder="Endereço de entrega (rua, número, bairro) *" class="fld">
      <label class="flex items-start gap-3 text-xs mute mt-1"><input id="fOk" type="checkbox" class="mt-0.5 w-4 h-4 shrink-0"><span>Concordo em enviar meus dados (nome, telefone e endereço) ao restaurante, apenas para atender este pedido.</span></label>
    </div>
    <div class="mt-4">
      <div class="font-semibold mb-2">Forma de pagamento</div>
      <label class="pay"><input type="radio" name="pay" value="Dinheiro"><span>Dinheiro</span></label>
      <div id="trocoBox" style="display:none" class="mb-2"><input id="troco" type="text" inputmode="decimal" placeholder="Troco para quanto? (opcional)" class="w-full rounded-2xl px-4 py-3 text-base outline-none" style="background:var(--card);border:1px solid var(--line);color:var(--ink)"></div>
      <label class="pay"><input type="radio" name="pay" value="Cartão"><span>Cartão</span></label>
      <label class="pay"><input type="radio" name="pay" value="Pix"><span>Pix</span></label>
    </div>
    <textarea id="obs" rows="2" placeholder="Observação (ex.: sabor da erva)" class="w-full rounded-2xl p-3 mt-3 text-base outline-none" style="background:var(--card);border:1px solid var(--line);color:var(--ink)"></textarea>
    <div class="flex items-center justify-between mt-4"><span class="font-semibold">Subtotal</span><span id="sTotal" class="text-xl font-extrabold" style="color:var(--acc)"></span></div>
    <p id="err" class="text-sm font-semibold mt-3" style="color:#c0392b"></p>
    <a id="sSend" target="_blank" rel="noopener" class="block text-center rounded-2xl py-4 text-lg font-bold mt-4" style="background:linear-gradient(135deg,#25d366,#128c4a);color:#fff">📱 Fazer Pedido no WhatsApp</a>
    <button id="sClear" class="block mx-auto mt-3 text-sm mute underline">Limpar pedido</button>
  </div>
</div>

<script>
const NAME='Point do Tereré';
const FONE='5565992912267';
const SHEET_URL=''; // cole aqui o link do Google Apps Script (veja o arquivo de instruções)
const TAXA='';
const D=[
{id:'naturais',n:'Naturais',l:['1,5L','3,5L'],note:'Sabores de ervas: Menta Black · Menta T-Frutti · Energético · Pura Folha · Menta Uva · Ice Cereja · Abacaxi com Hortelã. Informe o sabor da erva na observação do pedido.',
 i:[['Tererezeiro da Cidade','Limão da fruta.',[20,26]],['Limão e Hortelã','Água, limão e hortelã.',[25,30]],['Detox I','Abacaxi, hortelã e limão.',[35,42]],['Vitamina C','Limão fruta e laranja fruta espremidos.',[42,50]],['Fitness','Hibisco, gengibre, hortelã e limão.',[32,37]],['Galão de 5 Litros','Galão de 5 litros. Informe o sabor na observação do pedido.',[50]]]},
{id:'express',n:'Express',l:['1,5L','3,5L'],note:'Sabores de ervas: Menta Black · Menta T-Frutti · Energético · Pura Folha · Menta Uva · Ice Cereja · Abacaxi com Hortelã. Informe o sabor da erva na observação do pedido.',
 i:[['Limão Blue','Suco de limão, limão, casca e gelo.',[20,25]],['Limão e Laranja','Suco de limão e suco de laranja.',[20,26]],['Tropicana','Suco de abacaxi, limão e menta.',[20,26]],['Frutas Vermelhas','Suco de uva e suco de morango.',[20,26]],['Galão de 5 Litros','Galão de 5 litros. Informe o sabor na observação do pedido.',[35]]]},
{id:'petiscos',n:'Petiscos',l:[''],note:'',
 i:[['Batata Frita','Serve até 4 pessoas.',[20]],['Frango a Passarinho','Serve até 4 pessoas.',[30]],['Calabresa Acebolada','Serve até 4 pessoas.',[30]],['Meio da Asa','Serve até 4 pessoas.',[40]],['Coxinha de Frango','Serve até 4 pessoas.',[35]]]},
{id:'adicionais',n:'Adicionais',l:[''],note:'',
 i:[['Refil Express 1,5L','',[12]],['Refil Express 3,5L','',[20]],['Copo Adicional','',[4]]]}
];
const fmt=v=>'R$ '+v.toFixed(2).replace('.',',');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let cat='todos',term='';
document.title=NAME+' – Cardápio';
document.getElementById('cta').href='https://wa.me/'+FONE+'?text='+encodeURIComponent('Olá! Gostaria de fazer um pedido.');

const EM={naturais:'🍋',express:'⚡',petiscos:'🍟',adicionais:'➕'};
function chips(){
  const all=[{id:'todos',n:'Todos',e:'✨'}].concat(D.map(c=>({id:c.id,n:c.n,e:EM[c.id]})));
  document.getElementById('chips').innerHTML=all.map(c=>`<button data-c="${c.id}" class="chip ${c.id===cat?'on':''} shrink-0 rounded-full px-4 py-2 text-sm font-semibold">${c.e} ${c.n}</button>`).join('');
}
const ES={naturais:'Natural',express:'Express',petiscos:'Petisco',adicionais:'Adicional'};
let cart={},obs='',sheetOpen=false;
let pay='',troco='';
const val=id=>document.getElementById(id).value.trim();
function custTxt(){const n=val('fNome'),t=val('fTel'),e=val('fEnd');if(!n&&!t&&!e)return '';return '\n\nCliente: '+(n||'-')+'\nTelefone: '+(t||'-')+(e?'\nEndereço: '+e:'');}
function payTxt(){
  if(!pay) return '';
  let t='\n\nPagamento: '+pay;
  if(pay==='Dinheiro'&&troco.trim()){const n=parseFloat(troco.replace(/\./g,'').replace(',','.'));t+=' (troco para '+(isNaN(n)?troco.trim():'R$ '+num(n))+')';}
  return t;
}
try{cart=JSON.parse(localStorage.getItem('cartEC')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('cartEC',JSON.stringify(cart))}catch(e){}};
const num=v=>v.toFixed(2).replace('.',',');
function info(k){const [ci,ii,vi]=k.split('|').map(Number);const c=D[ci],x=c&&c.i[ii];if(!x)return null;const has=x[2].length>0;return{c,x,lbl:has?(c.l[vi]||''):'',p:has?x[2][vi]:null}}
const nm=l=>ES[l.c.id]+': '+l.x[0]+(l.lbl?' ('+l.lbl+')':'');
const lines=()=>Object.keys(cart).filter(k=>info(k)).map(k=>Object.assign({k,q:cart[k]},info(k)));
const ctl=k=>{const q=cart[k]||0;return q?`<div class="step"><button data-k="${k}" data-d="-1" aria-label="Remover um">−</button><span>${q}</span><button data-k="${k}" data-d="1" aria-label="Adicionar um">+</button></div>`:`<button class="add" data-k="${k}" data-d="1">+ Pedir</button>`};
const box=k=>`<div data-ctl="${k}">${ctl(k)}</div>`;
function price(ci,ii,x){
  const c=D[ci],p=x[2];
  if(!p.length) return `<div class="text-right"><div class="text-sm mute mb-2">Consultar</div>${box(ci+'|'+ii+'|0')}</div>`;
  if(p.length===1) return `<div class="text-right"><span class="pill"><small>R$</small>${num(p[0])}</span><div class="mt-2">${box(ci+'|'+ii+'|0')}</div></div>`;
  return `<div class="grid gap-2 mt-3" style="grid-template-columns:repeat(${p.length},1fr)">`+p.map((v,k)=>`<div class="tile"><div class="l">${c.l[k]}</div><div class="v">R$ ${num(v)}</div><div class="mt-2">${box(ci+'|'+ii+'|'+k)}</div></div>`).join('')+`</div>`;
}
function render(){
  const t=norm(term.trim());
  let html='',total=0;
  D.forEach((c,ci)=>{
    if(cat!=='todos'&&cat!==c.id) return;
    const its=c.i.map((x,ix)=>[x,ix]).filter(([x])=>!t||norm(x[0]).includes(t));
    if(!its.length) return;
    total+=its.length;
    html+=`<section id="s-${c.id}" class="mb-9"><div class="flex items-center gap-3 mb-3"><div class="ico">${EM[c.id]}</div><div><h2 class="disp text-3xl leading-none">${c.n}</h2><p class="text-xs mute mt-1">${its.length} ${its.length>1?'opções':'opção'}</p></div></div>`+
      (c.note?`<div class="note rounded-xl px-3 py-2 text-sm mb-3">ℹ️ ${c.note}</div>`:'')+
      its.map(([x,ix],k)=>{const one=x[2].length<2;return `<article class="card rounded-2xl p-4 mb-2.5" style="--d:${Math.min(k,8)*30}ms"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="font-bold text-[15px] leading-snug">${x[0]}</h3>${x[1]?`<p class="text-sm mt-1 mute leading-snug">${x[1]}</p>`:''}</div>${one?`<div class="shrink-0">${price(ci,ix,x)}</div>`:''}</div>${one?'':price(ci,ix,x)}</article>`}).join('')+
      `</section>`;
  });
  if(!total) html=`<p class="text-center py-16 mute">Nenhum prato encontrado para “${term}”. Tente outro nome ou escolha “Todos”.</p>`;
  else if(TAXA) html+=`<div class="note rounded-2xl px-4 py-3 text-center text-sm font-medium">🧾 ${TAXA}</div>`;
  document.getElementById('menu').innerHTML=html;
}
function msg(){
  const L=lines(); if(!L.length) return 'Olá! Gostaria de fazer um pedido.';
  let tot=0,cons=false;
  const r=L.map(l=>{if(l.p==null){cons=true;return `• ${l.q}x ${nm(l)} - valor a consultar`}const s=l.q*l.p;tot+=s;return `• ${l.q}x ${nm(l)} - R$ ${num(s)}`});
  return 'Olá! Gostaria de fazer o seguinte pedido:\n\n'+r.join('\n')+`\n\nSubtotal: R$ ${num(tot)}${cons?' (+ itens a consultar)':''}`+payTxt()+custTxt()+(obs.trim()?'\n\nObservação: '+obs.trim():'')+'\n\nObrigado!';
}
const waLink=()=>'https://wa.me/'+FONE+'?text='+encodeURIComponent(msg());
function renderSheet(){
  const L=lines();let t=0;
  document.getElementById('cartList').innerHTML=L.length?L.map(l=>{t+=l.q*(l.p||0);return `<div class="flex items-center justify-between gap-3 py-3" style="border-bottom:1px solid var(--line)"><div class="min-w-0"><div class="font-semibold text-sm leading-snug">${nm(l)}</div><div class="text-xs mute">${l.p==null?'valor a consultar':'R$ '+num(l.q*l.p)}</div></div>${ctl(l.k)}</div>`}).join(''):'<p class="text-center py-8 mute">Seu pedido está vazio.</p>';
  document.getElementById('sTotal').textContent='R$ '+num(t);
}
function updateBar(){
  const L=lines();let n=0,t=0;L.forEach(l=>{n+=l.q;t+=l.q*(l.p||0)});
  document.getElementById('cartBtn').style.display=n?'flex':'none';
  document.getElementById('cn').textContent=n+(n>1?' itens':' item');
  document.getElementById('ct').textContent='R$ '+num(t);
  const w=waLink();
  ['cta','sSend'].forEach(id=>{const a=document.getElementById(id);if(valid())a.href=w;else a.removeAttribute('href');a.style.cursor='pointer';});
  if(sheetOpen) renderSheet();
}
function change(k,d){
  const q=Math.max(0,(cart[k]||0)+d); if(q) cart[k]=q; else delete cart[k];
  save();
  document.querySelectorAll('[data-ctl="'+k+'"]').forEach(e=>e.innerHTML=ctl(k));
  updateBar();
}
function sheet(open){sheetOpen=open;document.getElementById('sheet').style.display=open?'block':'none';if(open)renderSheet();}
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  cat=b.dataset.c; chips(); render(); document.getElementById('menu').scrollIntoView({behavior:'smooth'});
});
document.getElementById('q').addEventListener('input',e=>{term=e.target.value;render();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)change(b.dataset.k,+b.dataset.d);});
document.getElementById('cartBtn').addEventListener('click',()=>sheet(true));
document.getElementById('sClose').addEventListener('click',()=>sheet(false));
document.getElementById('sBack').addEventListener('click',()=>sheet(false));
document.getElementById('sClear').addEventListener('click',()=>{
  cart={};save();
  pay='';troco='';
  document.querySelectorAll('input[name="pay"]').forEach(r=>r.checked=false);
  document.getElementById('troco').value='';
  document.getElementById('trocoBox').style.display='none';
  render();updateBar();
});
document.getElementById('obs').addEventListener('input',e=>{obs=e.target.value;updateBar();});
document.querySelectorAll('input[name="pay"]').forEach(r=>r.addEventListener('change',()=>{
  pay=r.value;
  document.getElementById('trocoBox').style.display=pay==='Dinheiro'?'block':'none';
  if(pay!=='Dinheiro'){troco='';document.getElementById('troco').value='';}
  updateBar();
}));
document.getElementById('troco').addEventListener('input',e=>{troco=e.target.value;updateBar();});
function valid(){return !lines().length||(!!val('fNome')&&val('fTel').replace(/\D/g,'').length>=10&&!!val('fEnd')&&document.getElementById('fOk').checked);}
['fNome','fTel','fEnd'].forEach(id=>document.getElementById(id).addEventListener('input',updateBar));
document.getElementById('fOk').addEventListener('change',updateBar);
function enviar(e){
  e.preventDefault();
  const L=lines(),w=waLink();
  if(!L.length){window.open(w,'_blank');return;}
  const nome=val('fNome'),tel=val('fTel'),err=document.getElementById('err');
  let m='';
  if(!nome) m='Informe seu nome.';
  else if(tel.replace(/\D/g,'').length<10) m='Informe um telefone com DDD.';
  else if(!val('fEnd')) m='Informe o endereço de entrega.';
  else if(!document.getElementById('fOk').checked) m='Marque a autorização para enviar seus dados.';
  if(m){sheet(true);err.textContent=m;return;}
  err.textContent='';
  if(SHEET_URL){
    const sub=L.reduce((a,l)=>a+l.q*(l.p||0),0);
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({id:'P'+Date.now().toString(36).toUpperCase(),restaurante:NAME,nome:nome,telefone:tel,endereco:val('fEnd'),
        itens:L.map(l=>l.q+'x '+nm(l)+(l.p==null?' (consultar)':'')).join(' | '),subtotal:sub,pagamento:pay,troco:troco.trim(),obs:obs.trim(),consent:true})}).catch(()=>{});
  }
  window.open(w,'_blank');
}
document.getElementById('cta').addEventListener('click',enviar);
document.getElementById('sSend').addEventListener('click',enviar);
chips();render();updateBar();
</script>
</body>
</html>
